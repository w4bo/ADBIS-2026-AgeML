pipeline:
  steps:
    normalization:
      candidates:
        standard:
          params: {}
        min-max:
          params:
            feature_range: [0, 1]
    classification:
      mandatory: true
      candidates:
        knn:
          params:
            n_neighbors: [5, 11]
            weights: [uniform, distance]
        rf:
          params:
            n_estimators: [50, 100, 150, 200]
            max_depth: [null, 20]