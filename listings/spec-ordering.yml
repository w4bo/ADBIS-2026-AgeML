pipeline:
  steps:
    normalization:
      candidates:
        min-max:
          params: {feature_range: [[0, 1]]}
    classification:
      mandatory: true
      candidates:
        knn:
          params:
            n_neighbors: [5, 11]
            weights: [uniform, distance]
ordering:
  - sequence: [imputation, normalization, features]
  - {before: features, after: classification}
constraints:
  - if: {step: {classification: knn}}
    require: [normalization, features]
  - if:
      dataset:
        has_feature:
          named_like: [class, target]
          data_type: [categorical, integer]
    require: [classification]
budgets:
  pipelines: 5
  generation_attempts: 10
  time: {hours: 2, minutes: 5, seconds: 30}
